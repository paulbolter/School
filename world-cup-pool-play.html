<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup Pool Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:        #10151b;   /* stadium night background */
    --pitch-2:      #161d26;   /* panel background */
    --line:         #25303d;   /* hairlines / borders */
    --turf:         #18b85a;   /* pitch green accent */
    --turf-dim:     #0f7a3c;
    --gold:         #f6c94a;   /* trophy / winner moment */
    --gold-dim:     #c79a2b;
    --ink:          #eef3f8;   /* primary text */
    --muted:        #8a98a8;   /* secondary text */
    --home:         #2f7df6;   /* team A accent (jersey blue) */
    --home-soft:    rgba(47,125,246,.14);
    --away:         #e0453c;   /* team B accent (jersey red) */
    --away-soft:    rgba(224,69,60,.14);
    --chip:         #1f2935;
    --shadow:       0 10px 30px rgba(0,0,0,.45);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c2733 0%, transparent 60%),
      var(--pitch);
    color:var(--ink);
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:18px clamp(12px,3vw,34px) 60px;
  }

  /* ---------- Header / scoreboard top bar ---------- */
  header{
    max-width:1180px; margin:0 auto 18px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:14px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .ball{ font-size:30px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .brand h1{
    font-family:"Oswald", sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em;
    font-size:clamp(20px,3vw,30px); margin:0; line-height:1;
  }
  .brand h1 span{ color:var(--turf); }

  .matchmeta{ margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .matchmeta label{
    font-size:11px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); display:flex; flex-direction:column; gap:4px;
  }
  .matchmeta input{
    font-family:"Oswald", sans-serif; font-weight:600; font-size:15px;
    background:var(--pitch-2); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:120px;
  }
  .matchmeta input:focus{ outline:2px solid var(--turf); outline-offset:1px; }

  /* ---------- Match card ---------- */
  .card{
    max-width:1180px; margin:0 auto;
    background:linear-gradient(180deg,#141b24,#10161e);
    border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr minmax(120px,180px) 1fr;
    align-items:stretch;
  }
  @media (max-width:760px){
    .grid{ grid-template-columns:1fr; }
  }

  /* team column */
  .team{ padding:22px clamp(14px,2.2vw,26px); position:relative; }
  .team.home{ background:linear-gradient(180deg,var(--home-soft),transparent 60%); }
  .team.away{ background:linear-gradient(180deg,var(--away-soft),transparent 60%); }
  .team.is-winner{ box-shadow:inset 0 0 0 2px var(--gold); }
  .team.is-winner::after{
    content:"WON THIS MATCH"; position:absolute; top:12px; right:14px;
    font-family:"Oswald",sans-serif; font-weight:700; font-size:11px; letter-spacing:.14em;
    color:var(--pitch); background:var(--gold); padding:4px 9px; border-radius:20px;
  }
  .team.home.is-winner::after{ left:14px; right:auto; }

  .teamhead{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .code{
    font-family:"Oswald",sans-serif; font-weight:700; font-size:clamp(26px,4vw,40px);
    line-height:1; padding:6px 12px; border-radius:10px; letter-spacing:.02em;
    background:var(--pitch); border:1px solid var(--line);
  }
  .team.home .code{ color:var(--home); border-color:rgba(47,125,246,.4); }
  .team.away .code{ color:var(--away); border-color:rgba(224,69,60,.4); }
  .flag{ font-size:26px; }
  .picker{
    margin-left:auto; background:var(--pitch); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:"Inter",sans-serif; font-size:13px; max-width:170px;
  }
  .picker:focus{ outline:2px solid var(--turf); outline-offset:1px; }
  .teamname{
    font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase;
    font-size:clamp(18px,2.4vw,24px); letter-spacing:.03em; margin:2px 0 14px;
  }

  /* add-name row */
  .addrow{ display:flex; gap:8px; margin-bottom:14px; }
  .addrow input{
    flex:1; background:var(--pitch); color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:11px 13px; font-size:15px; font-family:"Inter",sans-serif;
  }
  .addrow input:focus{ outline:2px solid var(--turf); outline-offset:1px; }
  .addrow button{
    border:0; border-radius:9px; padding:0 16px; font-weight:700; font-size:14px;
    cursor:pointer; color:#fff; font-family:"Inter",sans-serif;
  }
  .team.home .addrow button{ background:var(--home); }
  .team.away .addrow button{ background:var(--away); }
  .addrow button:hover{ filter:brightness(1.08); }

  .countbar{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    margin-bottom:10px;
  }
  .countbar b{ color:var(--ink); font-family:"Oswald",sans-serif; font-size:14px; }

  /* roster chips */
  .roster{ display:flex; flex-wrap:wrap; gap:8px; min-height:42px; align-content:flex-start; }
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--chip); border:1px solid var(--line); border-radius:24px;
    padding:7px 8px 7px 14px; font-size:15px; font-weight:500;
    animation:pop .18s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .chip .x{
    border:0; background:transparent; color:var(--muted); cursor:pointer;
    font-size:16px; line-height:1; width:22px; height:22px; border-radius:50%;
  }
  .chip .x:hover{ background:rgba(255,255,255,.08); color:var(--ink); }
  .empty{ color:var(--muted); font-size:14px; font-style:italic; padding:10px 2px; }

  /* center scoreboard strip */
  .center{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:18px 6px;
    background:
      repeating-linear-gradient(180deg,#0d1219 0 26px,#0f141c 26px 52px);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  @media (max-width:760px){
    .center{ border:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px; }
  }
  .vs{
    font-family:"Oswald",sans-serif; font-weight:700; font-size:clamp(30px,6vw,52px);
    line-height:1; color:var(--ink); text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .vs small{ display:block; text-align:center; font-size:12px; letter-spacing:.18em;
    color:var(--turf); font-weight:600; margin-top:6px; text-transform:uppercase; }

  /* ---------- Winner controls ---------- */
  .controls{
    max-width:1180px; margin:18px auto 0;
    background:var(--pitch-2); border:1px solid var(--line); border-radius:16px;
    padding:18px clamp(14px,2.4vw,26px); text-align:center;
  }
  .controls .q{
    font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted);
    margin:0 0 12px;
  }
  .winbtns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .winbtn{
    font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase;
    font-size:16px; letter-spacing:.03em; cursor:pointer;
    background:var(--pitch); color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; padding:12px 22px;
    display:inline-flex; align-items:center; gap:10px;
  }
  .winbtn .dot{ width:12px; height:12px; border-radius:50%; }
  .winbtn[data-side="home"] .dot{ background:var(--home); }
  .winbtn[data-side="away"] .dot{ background:var(--away); }
  .winbtn:hover{ border-color:var(--muted); }
  .winbtn.active{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(246,201,74,.3) inset; color:var(--gold); }

  .pick{
    font-family:"Oswald",sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; font-size:clamp(18px,2.6vw,24px);
    border:0; border-radius:14px; padding:16px 34px; cursor:pointer; color:var(--pitch);
    background:linear-gradient(180deg,#ffd968,var(--gold)); box-shadow:0 8px 22px rgba(246,201,74,.28);
    display:inline-flex; align-items:center; gap:12px; transition:transform .08s ease;
  }
  .pick:hover:not(:disabled){ transform:translateY(-2px); }
  .pick:active:not(:disabled){ transform:translateY(0); }
  .pick:disabled{ background:var(--line); color:var(--muted); box-shadow:none; cursor:not-allowed; }
  .hint{ color:var(--muted); font-size:13px; margin-top:12px; min-height:18px; }

  /* footer actions */
  .actions{
    max-width:1180px; margin:14px auto 0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  .ghost{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; font-family:"Inter",sans-serif;
  }
  .ghost:hover{ color:var(--ink); border-color:var(--muted); }

  /* winners log */
  .log{ max-width:1180px; margin:26px auto 0; }
  .log h2{
    font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:.1em; font-size:14px; color:var(--muted);
    display:flex; align-items:center; gap:10px; margin:0 0 12px;
  }
  .log h2::after{ content:""; flex:1; height:1px; background:var(--line); }
  .logwrap{ display:flex; flex-wrap:wrap; gap:10px; }
  .logitem{
    display:flex; align-items:center; gap:10px;
    background:var(--pitch-2); border:1px solid var(--line); border-left:3px solid var(--gold);
    border-radius:10px; padding:9px 14px; font-size:14px;
  }
  .logitem .who{ font-weight:600; }
  .logitem .team{ color:var(--muted); font-size:12px;
    font-family:"Oswald",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .log .empty{ font-size:14px; }

  /* ---------- Reveal overlay (the signature moment) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50; display:none;
    background:radial-gradient(800px 800px at 50% 40%, rgba(28,40,52,.96), rgba(8,11,16,.99));
    backdrop-filter:blur(2px);
    align-items:center; justify-content:center; flex-direction:column; gap:8px; text-align:center;
  }
  .overlay.show{ display:flex; }
  .overlay .eyebrow{
    font-family:"Oswald",sans-serif; letter-spacing:.3em; text-transform:uppercase;
    font-size:14px; color:var(--turf); font-weight:600;
  }
  .reel{
    font-family:"Oswald",sans-serif; font-weight:700; text-transform:uppercase;
    font-size:clamp(40px,9vw,96px); line-height:1.05; color:var(--ink);
    letter-spacing:.02em; padding:10px 30px; min-width:min(80vw,640px);
    border-top:2px solid var(--line); border-bottom:2px solid var(--line);
  }
  .reel.spinning{ color:var(--muted); filter:blur(.4px); }
  .reel.locked{ color:var(--gold); text-shadow:0 0 30px rgba(246,201,74,.5); animation:lock .4s ease-out; }
  @keyframes lock{ 0%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  .reel-team{
    font-family:"Oswald",sans-serif; font-size:18px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); min-height:24px;
  }
  .overlay .close{
    margin-top:18px; background:var(--pitch-2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:11px 24px; font-size:14px; cursor:pointer; font-weight:600;
    display:none;
  }
  .overlay.done .close{ display:inline-block; }
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:49; }

  @media (prefers-reduced-motion:reduce){
    .reel.spinning{ filter:none; }
    *{ animation-duration:.001s !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="ball">⚽</span>
    <h1>World Cup <span>Pool Play</span></h1>
  </div>
  <div class="matchmeta">
    <label>Group
      <input id="metaGroup" type="text" value="Group A" maxlength="14" aria-label="Group">
    </label>
    <label>Match
      <input id="metaMatch" type="text" value="Match 1" maxlength="14" aria-label="Match">
    </label>
  </div>
</header>

<main class="card">
  <div class="grid">
    <!-- HOME -->
    <section class="team home" id="teamHome">
      <div class="teamhead">
        <span class="code" id="codeHome">MEX</span>
        <span class="flag" id="flagHome">🇲🇽</span>
        <select class="picker" id="pickHome" aria-label="Choose home team"></select>
      </div>
      <div class="teamname" id="nameHome">Mexico</div>
      <div class="addrow">
        <input id="inHome" type="text" placeholder="Add a student who picked this team…" autocomplete="off">
        <button id="addHome">Add</button>
      </div>
      <div class="countbar"><span>Picks</span><b id="cntHome">0</b></div>
      <div class="roster" id="rosterHome"></div>
    </section>

    <!-- CENTER -->
    <div class="center">
      <div class="vs">VS<small>Kick-off</small></div>
    </div>

    <!-- AWAY -->
    <section class="team away" id="teamAway">
      <div class="teamhead">
        <span class="code" id="codeAway">RSA</span>
        <span class="flag" id="flagAway">🇿🇦</span>
        <select class="picker" id="pickAway" aria-label="Choose away team"></select>
      </div>
      <div class="teamname" id="nameAway">South Africa</div>
      <div class="addrow">
        <input id="inAway" type="text" placeholder="Add a student who picked this team…" autocomplete="off">
        <button id="addAway">Add</button>
      </div>
      <div class="countbar"><span>Picks</span><b id="cntAway">0</b></div>
      <div class="roster" id="rosterAway"></div>
    </section>
  </div>
</main>

<section class="controls">
  <p class="q">Which team won this match?</p>
  <div class="winbtns">
    <button class="winbtn" data-side="home" id="winHome"><span class="dot"></span><span id="winHomeLbl">Mexico</span></button>
    <button class="winbtn" data-side="away" id="winAway"><span class="dot"></span><span id="winAwayLbl">South Africa</span></button>
  </div>
  <button class="pick" id="pickWinner" disabled>🎲 Pick Random Winner</button>
  <div class="hint" id="hint">Select the winning team to enable the draw.</div>
</section>

<div class="actions">
  <button class="ghost" id="newMatch">Start new match (clears picks)</button>
  <button class="ghost" id="clearAll">Reset everything</button>
</div>

<section class="log">
  <h2>Winners log</h2>
  <div class="logwrap" id="logWrap"></div>
</section>

<!-- Reveal -->
<div class="overlay" id="overlay" role="dialog" aria-live="polite">
  <div class="eyebrow">And the winner is…</div>
  <div class="reel" id="reel">—</div>
  <div class="reel-team" id="reelTeam"></div>
  <button class="close" id="closeOverlay">Done</button>
</div>
<canvas id="confetti"></canvas>

<script>
/* ============================================================
   World Cup Pool Play — single file, no dependencies.
   Auto-saves to the browser (localStorage) so picks survive
   a page refresh. On GitHub Pages this works automatically.
   ============================================================ */

// --- A curated set of national teams: name, 3-letter code, flag emoji
const TEAMS = [
  ["Argentina","ARG","🇦🇷"],["Australia","AUS","🇦🇺"],["Belgium","BEL","🇧🇪"],
  ["Brazil","BRA","🇧🇷"],["Cameroon","CMR","🇨🇲"],["Canada","CAN","🇨🇦"],
  ["Chile","CHI","🇨🇱"],["Colombia","COL","🇨🇴"],["Costa Rica","CRC","🇨🇷"],
  ["Croatia","CRO","🇭🇷"],["Denmark","DEN","🇩🇰"],["Ecuador","ECU","🇪🇨"],
  ["Egypt","EGY","🇪🇬"],["England","ENG","🏴󠁧󠁢󠁥󠁮󠁧󠁿"],["France","FRA","🇫🇷"],
  ["Germany","GER","🇩🇪"],["Ghana","GHA","🇬🇭"],["Iran","IRN","🇮🇷"],
  ["Italy","ITA","🇮🇹"],["Ivory Coast","CIV","🇨🇮"],["Japan","JPN","🇯🇵"],
  ["Jordan","JOR","🇯🇴"],["Mexico","MEX","🇲🇽"],["Morocco","MAR","🇲🇦"],
  ["Netherlands","NED","🇳🇱"],["New Zealand","NZL","🇳🇿"],["Nigeria","NGA","🇳🇬"],
  ["Norway","NOR","🇳🇴"],["Panama","PAN","🇵🇦"],["Peru","PER","🇵🇪"],
  ["Poland","POL","🇵🇱"],["Portugal","POR","🇵🇹"],["Qatar","QAT","🇶🇦"],
  ["Saudi Arabia","KSA","🇸🇦"],["Senegal","SEN","🇸🇳"],["South Africa","RSA","🇿🇦"],
  ["South Korea","KOR","🇰🇷"],["Spain","ESP","🇪🇸"],["Sweden","SWE","🇸🇪"],
  ["Switzerland","SUI","🇨🇭"],["Tunisia","TUN","🇹🇳"],["United States","USA","🇺🇸"],
  ["Uruguay","URU","🇺🇾"],["Uzbekistan","UZB","🇺🇿"]
];

const $ = id => document.getElementById(id);

// --- State (with a safe default match: Mexico vs South Africa)
const DEFAULT = {
  group:"Group A", match:"Match 1",
  home:{ name:"Mexico", code:"MEX", flag:"🇲🇽", players:[] },
  away:{ name:"South Africa", code:"RSA", flag:"🇿🇦", players:[] },
  winner:null,            // "home" | "away" | null
  log:[]                  // [{who, team, code}]
};
let state = load() || structuredClone(DEFAULT);

// --- Storage (wrapped so it never breaks if storage is blocked)
function save(){ try{ localStorage.setItem("wcPool", JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem("wcPool"); return s?JSON.parse(s):null; }catch(e){ return null; } }

// --- Build the team dropdowns
function fillPickers(){
  [["pickHome","home"],["pickAway","away"]].forEach(([id,side])=>{
    const sel=$(id); sel.innerHTML="";
    TEAMS.forEach(([name,code,flag])=>{
      const o=document.createElement("option");
      o.value=code; o.textContent=`${code} · ${name}`;
      if(state[side].code===code) o.selected=true;
      sel.appendChild(o);
    });
  });
}

// --- Render everything from state
function render(){
  $("metaGroup").value=state.group;
  $("metaMatch").value=state.match;

  ["home","away"].forEach(side=>{
    const t=state[side];
    $("code"+cap(side)).textContent=t.code;
    $("flag"+cap(side)).textContent=t.flag;
    $("name"+cap(side)).textContent=t.name;
    $("cnt"+cap(side)).textContent=t.players.length;
    $("win"+cap(side)+"Lbl").textContent=t.name;

    const r=$("roster"+cap(side)); r.innerHTML="";
    if(t.players.length===0){
      const e=document.createElement("div");
      e.className="empty"; e.textContent="No picks yet.";
      r.appendChild(e);
    } else {
      t.players.forEach((p,i)=>{
        const chip=document.createElement("span"); chip.className="chip";
        chip.innerHTML=`<span>${escapeHtml(p)}</span>`;
        const x=document.createElement("button");
        x.className="x"; x.textContent="×"; x.title="Remove "+p;
        x.onclick=()=>{ state[side].players.splice(i,1); save(); render(); };
        chip.appendChild(x); r.appendChild(chip);
      });
    }
  });

  // winner highlight + buttons
  $("teamHome").classList.toggle("is-winner", state.winner==="home");
  $("teamAway").classList.toggle("is-winner", state.winner==="away");
  $("winHome").classList.toggle("active", state.winner==="home");
  $("winAway").classList.toggle("active", state.winner==="away");

  // draw button availability
  const btn=$("pickWinner"), hint=$("hint");
  if(!state.winner){
    btn.disabled=true; hint.textContent="Select the winning team to enable the draw.";
  } else {
    const pool=state[state.winner].players;
    if(pool.length===0){
      btn.disabled=true;
      hint.textContent="Nobody picked "+state[state.winner].name+" — add a name or change the winner.";
    } else {
      btn.disabled=false;
      hint.textContent="Drawing from "+pool.length+" student"+(pool.length>1?"s":"")+" who picked "+state[state.winner].name+".";
    }
  }

  // log
  const lw=$("logWrap"); lw.innerHTML="";
  if(state.log.length===0){
    lw.innerHTML='<div class="empty">No winners drawn yet. The slot reel awaits.</div>';
  } else {
    [...state.log].reverse().forEach(item=>{
      const d=document.createElement("div"); d.className="logitem";
      d.innerHTML=`<span>🏆</span><span class="who">${escapeHtml(item.who)}</span><span class="team">${escapeHtml(item.code||item.team)}</span>`;
      lw.appendChild(d);
    });
  }
}

const cap = s => s[0].toUpperCase()+s.slice(1);
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- Add a player
function addPlayer(side){
  const inp=$("in"+cap(side)); const v=inp.value.trim();
  if(!v) return;
  state[side].players.push(v); inp.value=""; inp.focus();
  save(); render();
}

// --- Choose teams from dropdown
function setTeam(side, code){
  const t=TEAMS.find(x=>x[1]===code); if(!t) return;
  state[side].name=t[0]; state[side].code=t[1]; state[side].flag=t[2];
  save(); render();
}

// --- Wire up events
fillPickers(); render();

$("addHome").onclick=()=>addPlayer("home");
$("addAway").onclick=()=>addPlayer("away");
$("inHome").addEventListener("keydown",e=>{ if(e.key==="Enter") addPlayer("home"); });
$("inAway").addEventListener("keydown",e=>{ if(e.key==="Enter") addPlayer("away"); });
$("pickHome").onchange=e=>setTeam("home", e.target.value);
$("pickAway").onchange=e=>setTeam("away", e.target.value);
$("metaGroup").oninput=e=>{ state.group=e.target.value; save(); };
$("metaMatch").oninput=e=>{ state.match=e.target.value; save(); };

$("winHome").onclick=()=>{ state.winner = state.winner==="home"?null:"home"; save(); render(); };
$("winAway").onclick=()=>{ state.winner = state.winner==="away"?null:"away"; save(); render(); };

$("newMatch").onclick=()=>{
  if(!confirm("Clear both teams' student picks and start a fresh match?\n(The winners log is kept.)")) return;
  state.home.players=[]; state.away.players=[]; state.winner=null;
  save(); render();
};
$("clearAll").onclick=()=>{
  if(!confirm("Reset EVERYTHING — teams, picks and the winners log — back to the start?")) return;
  state=structuredClone(DEFAULT); save(); fillPickers(); render();
};

// ============================================================
//  The reveal: spinning name reel + confetti
// ============================================================
$("pickWinner").onclick=runDraw;

function runDraw(){
  const pool=state[state.winner].players.slice();
  if(pool.length===0) return;
  const team=state[state.winner];
  const chosen=pool[Math.floor(Math.random()*pool.length)];

  const overlay=$("overlay"), reel=$("reel"), reelTeam=$("reelTeam"), closeBtn=$("closeOverlay");
  overlay.classList.add("show"); overlay.classList.remove("done");
  reel.classList.add("spinning"); reel.classList.remove("locked");
  reelTeam.textContent = team.code+" · "+team.name;

  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  if(reduce || pool.length===1){
    lock();
    return;
  }

  // Accelerate-then-decelerate name flicker
  let elapsed=0; const total=2600; let last=0;
  function step(ts){
    if(!last) last=ts;
    elapsed+=ts-last; last=ts;
    // delay grows as we approach the end (ease-out feel)
    const p=elapsed/total;
    reel.textContent=pool[Math.floor(Math.random()*pool.length)];
    if(p<1){
      const delay=40+Math.pow(p,3)*260;       // 40ms → ~300ms
      setTimeout(()=>requestAnimationFrame(step), delay);
    } else {
      lock();
    }
  }
  requestAnimationFrame(step);

  function lock(){
    reel.textContent=chosen;
    reel.classList.remove("spinning"); reel.classList.add("locked");
    overlay.classList.add("done");
    burstConfetti();
    // record once
    state.log.push({ who:chosen, team:team.name, code:team.code });
    save(); render();
  }
}

$("closeOverlay").onclick=()=>{ $("overlay").classList.remove("show"); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("overlay").classList.contains("show")) $("overlay").classList.remove("show");
});

// --- Lightweight canvas confetti
function burstConfetti(){
  const c=$("confetti"), ctx=c.getContext("2d");
  c.width=innerWidth; c.height=innerHeight;
  const colors=["#f6c94a","#18b85a","#2f7df6","#e0453c","#ffffff"];
  const parts=Array.from({length:140},()=>({
    x:innerWidth/2 + (Math.random()-.5)*200,
    y:innerHeight/2,
    vx:(Math.random()-.5)*14,
    vy:Math.random()*-15-4,
    g:.4+Math.random()*.3,
    s:6+Math.random()*8,
    r:Math.random()*Math.PI,
    vr:(Math.random()-.5)*.4,
    col:colors[Math.floor(Math.random()*colors.length)],
    life:0
  }));
  let frames=0;
  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    let alive=false;
    parts.forEach(p=>{
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
      if(p.y<c.height+40){ alive=true; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);
      ctx.restore();
    });
    frames++;
    if(alive && frames<220) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}
</script>
